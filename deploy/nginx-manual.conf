# Staff manual at https://sunsetsamui.com/manual/ - static files, nothing runs on the server.
# deploy/publish.sh copies site/ to /var/www/sunset-manual. nginx lets in anyone signed in to the
# admin as staff: before serving a file it asks the web app (sunset-beach,
# GET /api/session/staff-check on 127.0.0.1:3000), which checks the session cookie with the backend.
# Not signed in, a guest, or a disabled account -> /login?callbackUrl=/manual/..., and back here after
# signing in. The answer "yes" is cached for 60 s per cookie so one page's ~80 images don't each ask
# the backend; "no" is never cached, so signing in works at once. The /manual/ prefix doesn't touch
# /api/, /mobile/ or the site.
#
# Install on the VPS (deploy/DEPLOY.md has the full steps):
#   1. Put the proxy_cache_path line at the top of /etc/nginx/sites-available/sunsetsamui (outside any
#      server block - it belongs to the http context), next to the map blocks of /mobile/.
#   2. Put the location blocks inside the `server { listen 443 ... }` block, replacing the earlier
#      /manual blocks (the ones with auth_basic).
#   3. nginx -t && systemctl reload nginx

# --- http context (outside the server block) ---

proxy_cache_path /var/cache/nginx/sunset-manual-auth levels=1 keys_zone=sunset_manual_auth:1m max_size=5m inactive=5m use_temp_path=off;

# --- inside the 443 server block ---

location = /manual {
    return 301 /manual/;
}

# ^~ so that no regex location of the site (e.g. caching rules for images) takes /manual/img/*.
location ^~ /manual/ {
    auth_request /_sunset_manual_auth;
    error_page 401 = @sunset_manual_login;

    alias /var/www/sunset-manual/;
    index index.html;
    try_files $uri $uri/ =404;

    # Behind a login: Cloudflare and browsers must not keep a shared copy.
    add_header Cache-Control "private, no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /_sunset_manual_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/session/staff-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;

    proxy_cache sunset_manual_auth;
    proxy_cache_key $http_cookie;
    proxy_cache_valid 204 60s;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
}

location @sunset_manual_login {
    return 302 /login?callbackUrl=$uri;
}
