# Staff manual at https://sunsetsamui.com/manual/ - static files, nothing runs on the server.
# deploy/publish.sh copies site/ to /var/www/sunset-manual; nginx serves it behind one shared
# staff password (basic auth). The /manual/ prefix doesn't touch /api/, /mobile/ or the site.
#
# Install on the VPS (deploy/DEPLOY.md has the full steps):
#   1. Create the password file (the password is typed at the prompt, never on the command line):
#        sudo htpasswd -c /etc/nginx/sunset-manual.htpasswd staff
#   2. Put the two location blocks below inside the `server { listen 443 ... }` block of
#      /etc/nginx/sites-available/sunsetsamui, next to the existing ones.
#   3. sudo nginx -t && sudo systemctl reload nginx

# --- inside the 443 server block ---

location = /manual {
    return 301 /manual/;
}

location /manual/ {
    alias /var/www/sunset-manual/;
    index index.html;
    try_files $uri $uri/ =404;

    auth_basic "Sunset staff manual";
    auth_basic_user_file /etc/nginx/sunset-manual.htpasswd;

    # Behind a password: Cloudflare and browsers must not keep a shared copy.
    add_header Cache-Control "private, no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
