<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sunset Staff Manual</title>
<style>
:root { --bg: #F7F2E6; --fg: #12282D; --line: #DCD3BE; --muted: #4E6267; }
@media (prefers-color-scheme: dark) { :root { --bg: #0F262B; --fg: #F3ECDA; --line: #2A4A52; --muted: #A9B9B5; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, "Noto Sans Thai", sans-serif; padding: 16px; box-sizing: border-box; }
main { text-align: center; }
h1 { font-weight: 500; font-size: 28px; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 24px; }
nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
a { color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 10px 22px; font-size: 17px; }
a:hover { border-color: var(--fg); }
</style>
</head>
<body>
<main>
<h1>Sunset Staff Manual</h1>
<p>คู่มือระบบ Sunset</p>
<nav><a href="en/">English</a><a href="th/">ภาษาไทย</a></nav>
</main>
</body>
</html>
